[project]
name = "chess-coach"
version = "0.1.0"
description = "Evaluation framework to judge an LLM's chess coach skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.120.2",
    "chess>=1.11",
    "inspect-ai>=0.3.251",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
